summary = "Google TTS Cho NVDA"
description = """Sử dụng cục bộ các giọng chuyển văn bản thành giọng nói WASM của Google thông qua runtime trình duyệt nhân Chromium được hỗ trợ như Google Chrome, Microsoft Edge hoặc Brave làm bộ đọc cho NVDA."""
changelog = """Phiên bản 1.0:
- Văn bản vừa và dài bắt đầu đọc nhanh hơn nhờ ưu tiên đoạn đầu ngắn; tình trạng ngắt quãng cũng giảm nhờ đệm âm thanh và dùng lại âm thanh đã tạo xong đang được giữ tạm trong RAM.
- Cải thiện cách ngắt câu và cụm trong văn bản đa ngôn ngữ; tính năng Sử dụng hồ sơ ngôn ngữ tự động cũng chọn hồ sơ phù hợp chính xác hơn nhờ dữ liệu chính thức Unicode 17.0 và CLDR 48.2.
- Tăng âm lượng mặc định và giữ âm lượng ổn định hơn, không còn tăng giảm bất thường. Tùy chọn Âm lượng vẫn điều chỉnh theo đúng tỉ lệ. Hiện tượng méo ở một số giọng nam bắt nguồn từ công cụ WASM TTS gốc; phiên bản này không nhằm khắc phục hiện tượng đó.
- Cải thiện khả năng phục hồi khi runtime trình duyệt nhân Chromium, công cụ WASM TTS hoặc đầu ra âm thanh của NVDA gặp lỗi; không để tùy chọn Giữ runtime trình duyệt của Google TTS sẵn sàng trong nền giữ lại runtime bị lỗi; đồng thời giảm nguy cơ xung đột với add-on khác.
- Nâng công cụ WASM TTS đi kèm lên phiên bản 20260806.1.
- Cập nhật bản dịch cho khớp với phiên bản 1.0."""
