summary = "Google TTS Cho NVDA"
description = """Sử dụng cục bộ các giọng chuyển văn bản thành giọng nói WASM của Google thông qua runtime trình duyệt nhân Chromium được hỗ trợ như Google Chrome, Microsoft Edge hoặc Brave làm bộ đọc cho NVDA."""
changelog = """Phiên bản 0.6:
- Thêm tùy chọn giúp Google TTS sẵn sàng nhanh hơn khi chuyển từ bộ đọc khác sang. Tùy chọn này tắt theo mặc định; khi bật, tùy chọn này có thể dùng thêm bộ nhớ khi NVDA đang chạy.
- Khi bật tùy chọn này, Google TTS sẽ cập nhật phần chuẩn bị trong nền sau khi bạn đổi runtime trình duyệt nhân Chromium hoặc cài đặt/xóa gói giọng.
- Cải thiện độ ổn định khi chuyển khỏi Google TTS, nhất là lúc giọng đọc hoặc quá trình chuẩn bị giọng vẫn đang dừng."""
