summary = "NVDA 版 Google 文字转语音"
description = """通过受支持的 Chromium 浏览器运行时（如 Google Chrome、Microsoft Edge 或 Brave），在本地使用 Google WASM 文字转语音技术提供的语音，并将其用作 NVDA 语音合成器。"""
changelog = """版本 1.0：
- 提升中长文本的朗读响应速度：更快开始朗读、更顺畅地缓冲音频，并可复用暂存在 RAM 中的已生成音频。
- 使用 Unicode 17.0 和 CLDR 48.2 官方数据改进多语言句子和短语分段，以及“使用自动语言配置文件”功能。
- 提高默认语音音量并保持音量稳定，避免异常的忽高忽低。“音量”设置仍按比例调节。部分男声的失真来自原始 WASM TTS 引擎，本次更改不处理此问题。
- 改进 Chromium 浏览器运行时、WASM TTS 引擎和 NVDA 音频输出发生故障后的恢复能力；避免“让 Google 文字转语音的浏览器运行时在后台保持就绪”继续保留异常的运行时；并减少与其他插件的冲突。
- 将随附的 WASM TTS 引擎更新至 20260806.1 版。
- 更新翻译，使其与 1.0 版保持一致。"""
