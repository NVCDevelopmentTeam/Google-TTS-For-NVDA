summary = "Google TTS FOR NVDA"
description = """通过受支持的 Chromium 内核浏览器运行时（如 Google Chrome、Microsoft Edge 或 Brave），在本地使用 Google 的 WASM 文本转语音（TTS）语音作为 NVDA 的语音合成器。"""
changelog = """1.0 版本：
- 通过优先处理较短的开头片段，使中长文本能够更快开始朗读；同时通过音频缓冲，以及在 RAM 中暂存并复用已生成的音频，减少朗读过程中出现卡顿的情况。
- 改进多语言文本中的句子和短语分段方式；“自动使用语言配置文件”功能也能够更加准确地选择合适的语言配置文件，这得益于 Unicode 17.0 和 CLDR 48.2 的官方数据。
- 提高默认音量，并使音量更加稳定，不再出现异常的忽高忽低。音量选项仍会按照正确的比例进行调节。部分男声音色出现的失真源于原始 WASM TTS 引擎；本版本不旨在解决此问题。
- 改进 Chromium 内核浏览器运行时、WASM TTS 引擎或 NVDA 音频输出发生错误时的恢复能力；避免“让 Google TTS 浏览器运行时在后台保持就绪”选项继续保留已发生故障的运行时；同时降低与其他插件发生冲突的风险。
- 将随附的 WASM TTS 引擎升级至 20260806.1 版本。
- 更新翻译，使其与 1.0 版本保持一致。"""
