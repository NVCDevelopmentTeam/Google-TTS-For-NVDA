summary = "Google TTS Para NVDA"
description = """Permite utilizar localmente las voces de texto a voz WASM de Google a través de un entorno de ejecución compatible del navegador Chromium, como Google Chrome, Microsoft Edge o Brave, y emplearlas como sintetizador de NVDA."""
changelog = """Versión 1.0:
- Se mejoró la respuesta al leer textos medianos y largos, con un inicio más rápido, un búfer de audio más fluido y la reutilización del audio terminado que se conserva temporalmente en la RAM.
- Se mejoraron las divisiones de frases y expresiones multilingües y la función Utilizar perfiles de idioma automáticos mediante datos oficiales de Unicode 17.0 y CLDR 48.2.
- Se aumentó el volumen predeterminado de la voz y se mantuvo más estable, sin subidas ni bajadas anormales. La opción Volumen sigue siendo proporcional. La distorsión de algunas voces masculinas procede del motor WASM TTS original y este cambio no la corrige.
- Se mejoró la recuperación tras fallos del entorno de ejecución del navegador Chromium, del motor WASM TTS y de la salida de audio de NVDA; se impidió que Mantener preparado en segundo plano el entorno de ejecución del navegador de Google TTS conservara entornos dañados; y se redujeron los conflictos con otros complementos.
- Se actualizó el motor WASM TTS incluido a la versión 20260806.1.
- Se actualizaron las traducciones para la versión 1.0."""
