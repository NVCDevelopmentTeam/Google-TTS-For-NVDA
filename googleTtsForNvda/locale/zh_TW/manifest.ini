summary = "Google TTS For NVDA"
description = """透過受支援的 Chromium 瀏覽器執行階段（例如 Google Chrome、Microsoft Edge 或 Brave），在本機使用 Google 的 WASM 文字轉語音（TTS）語音，作為 NVDA 的合成器。"""
changelog = """版本 0.6:
- 新增一個選用設定，讓您從其他合成器切換過來時能更快使用 Google TTS。此設定預設為關閉；開啟後，NVDA 執行期間可能會使用較多記憶體。
- 開啟此設定後，當您變更所選的 Chromium 瀏覽器執行階段或安裝/移除語音套件時，Google TTS 會更新其背景準備工作。
- 改善了從 Google TTS 切換到其他合成器時的穩定性，特別是在語音朗讀或語音準備仍在停止的期間。"""
