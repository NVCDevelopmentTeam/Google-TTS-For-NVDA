summary = "Google TTS для NVDA"
description = """Використовуйте WASM-голоси синтезу мовлення Google локально через підтримуване середовище виконання браузера на базі Chromium, як-от Google Chrome, Microsoft Edge або Brave, як синтезатор NVDA."""
changelog = """Версія 0.5.5:
- Покращено автоматичне зіставлення мовних профілів між псевдонімами мовних кодів CLD2 та Google TTS, зокрема для філіппінської/тагальської, яванської, застарілих кодів івриту, варіантів норвезької, арабської, а також спрощеної, традиційної та кантонської китайської мов.
- Перекомпільовано вбудовані DLL-файли CLD2 для Windows за допомогою MSVC замість MinGW-w64, завдяки чому цей додаток більше не викликає помилкове виявлення антивірусом під час тестування на VirusTotal."""
