summary = "Google TTS для NVDA"
description = """Використовуйте WASM-голоси синтезу мовлення Google локально через підтримуване середовище виконання браузера на базі Chromium, як-от Google Chrome, Microsoft Edge або Brave, як синтезатор NVDA."""
changelog = """Версія 1.0:
- Покращено швидкість відгуку під час читання середніх та довгих текстів завдяки швидшому запуску, плавнішому буферизуванню аудіо та повторному використанню готових аудіофрагментів, тимчасово збережених в оперативній пам’яті.
- Покращено розбиття речень та фраз у багатомовних текстах, а також роботу функції «Використовувати автоматичні мовні профілі» з використанням офіційних даних Unicode 17.0 та CLDR 48.2.
- Збільшено гучність мовлення та забезпечено стабільнішу гучність без аномальних стрибків. Налаштування гучності залишається пропорційним. Спотворення в деяких чоловічих голосах зумовлені оригінальним двигуном WASM TTS і не усуваються цією зміною.
- Покращено відновлення після збоїв у середовищі виконання браузера Chromium, двигуні WASM TTS та аудіовиводу NVDA; усунуто збереження несправних середовищ виконання функцією «Утримувати середовище виконання Google TTS у фоновому режимі»; а також зменшено конфлікти з іншими додатками.
- Оновлено вбудований двигун WASM TTS до версії 20260806.1.
- Оновлено переклади відповідно до версії 1.0."""
