summary = "Google TTS для NVDA"
description = """Використовуйте WASM-голоси синтезу мовлення Google локально через підтримуване середовище виконання браузера на базі Chromium, як-от Google Chrome, Microsoft Edge або Brave, як синтезатор NVDA."""
changelog = """Версія 0.6:
- Додано додатковий параметр для швидшої підготовки Google TTS під час перемикання з іншого синтезатора. Цей параметр початково вимкнено; якщо його ввімкнено, він може використовувати більше пам'яті під час роботи NVDA.
- Коли цей параметр увімкнено, Google TTS оновлює фонову підготовку після зміни вибраного середовища виконання браузера Chromium або встановлення/видалення голосових пакетів.
- Покращено надійність під час перемикання з Google TTS, особливо під час зупинки підготовки мовлення або голосу."""
